name: Mutation testing

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "src/VisualNotes.Core/Models/HierarchicalSettings.cs"
      - "src/VisualNotes.Core/Services/BoundingBoxNormalizer.cs"
      - "src/VisualNotes.Core/Services/SyntheticImageCropper.cs"
      - "src/VisualNotes.Core/Services/ScreenCaptureGeometry.cs"
      - "src/VisualNotes.Core/Services/PersistentRegionService.cs"
      - "src/VisualNotes.Core/Services/EffectiveSettingsResolver.cs"
      - "src/VisualNotes.Core/Services/CaptureDuplicateDetection.cs"
      - "src/VisualNotes.Core/Services/CaptureLibrary.cs"
      - "src/VisualNotes.Core/Services/LocalSearchIndex.cs"
      - "src/VisualNotes.Core/Services/SessionCoordinator.cs"
      - "src/VisualNotes.Core/Services/StructuredAnalysisResponses.cs"
      - "src/VisualNotes.Core/Services/PromptComposer.cs"
      - "src/VisualNotes.Core/Services/SemanticDocumentComposition.cs"
      - "tests/VisualNotes.UnitTests/**"
      - "stryker-config.json"
      - ".config/dotnet-tools.json"
      - ".github/workflows/mutations.yml"

permissions:
  contents: read

concurrency:
  group: mutations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-mutations:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CI: true
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/packages.lock.json
      - shell: pwsh
        run: ./eng/restore-locked.ps1 -Target VisualNotes.sln
      - run: dotnet tool restore
      - name: Mutate critical VisualNotes.Core behavior
        run: dotnet stryker
      - name: Publish Stryker HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stryker-report
          path: StrykerOutput/**
          if-no-files-found: warn
